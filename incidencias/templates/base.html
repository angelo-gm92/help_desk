<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HelpDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f8;
            min-height:100vh;
        }

        .navbar-custom{
            background:white;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .logo{
            font-size:1.6rem;
            font-weight:bold;
            color:#25b7ad;
        }

        .hero{
            background:white;
            padding:50px;
            border-radius:20px;
            margin-top:30px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .btn-main{
            background:#25b7ad;
            color:white;
            border:none;
        }

        .btn-main:hover{
            background:#1f9a92;
            color:white;
        }

        .card-custom{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand logo" href="/">
            HelpDesk
        </a>
    </div>
</nav>

<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
